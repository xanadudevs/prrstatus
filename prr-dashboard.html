<style>
  @import url('https://fonts.googleapis.com/css2?family=Overpass:wght@500;600;700;800&display=swap');

  :root{
    --bg: #F4F6FA;
    --ink: #16213A;
    --ink-soft: #6B7690;
    --card: #FFFFFF;
    --line: #E4E8F0;

    --normal: #1E8A5F;
    --normal-bg: #E4F3EC;

    --atencao: #D98A1E;
    --atencao-bg: #FCF0DD;

    --risco: #C6432E;
    --risco-bg: #FBE6E2;

    --concluido: #2C5F8A;
    --concluido-bg: #E1EAF1;
  }

  *{ box-sizing: border-box; }
  button, input, select, textarea{ font-family: inherit; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Overpass', sans-serif;
    min-height: 100vh;
  }

  .wrap{ max-width: 1240px; margin: 0 auto; padding: 40px 24px 100px; }

  header{
    display:flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 24px; margin-bottom: 6px;
  }

  h1{ font-weight: 800; font-size: 30px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lede{ color: var(--ink-soft); font-size: 13.5px; margin: 0; font-weight: 600; }

  .brand{ display:flex; align-items:center; gap:18px; }
  .brand-logo{ height:48px; width:auto; display:block; }

  .toolbar{ display:flex; align-items:center; gap: 12px; flex-wrap: wrap; }
  .toolbar button{
    background: var(--ink); color: #fff; border: none; border-radius: 7px;
    font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12.5px;
    padding: 10px 16px; cursor: pointer;
  }
  .toolbar button:hover{ opacity: .85; }
  .toolbar button:disabled{ background: var(--line); cursor: not-allowed; }

  .status-msg{ font-size: 12.5px; color: var(--ink-soft); font-weight: 600; min-height: 18px; }
  .status-msg.err{ color: var(--risco); }

  .updated{ font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: 4px 0 24px; }

  /* Summary */
  .summary{ display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
  .summary .tile{ background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .summary .tile .num{ font-family: 'Overpass', sans-serif; font-size: 21px; font-weight: 700; }
  .summary .tile .label{ font-size: 10.5px; color: var(--ink-soft); margin-top: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.3; }

  /* Filters */
  .filters{ display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; align-items:center; }
  .chip{
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 20px;
    cursor: pointer; font-family: 'Overpass', sans-serif;
  }
  .chip.active{ background: var(--ink); color: #fff; border-color: var(--ink); }
  /* Category groups */
  .category-group{ margin-bottom: 36px; }
  .category-title{
    font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0 0 14px; padding-left: 2px;
  }

  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 18px; }

  .card{
    background: var(--card); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(22,33,58,0.04), 0 8px 24px -16px rgba(22,33,58,0.15);
    overflow: hidden; border: 1px solid var(--line);
  }
  .card-bar{ height: 5px; }
  .card-bar.normal{ background: var(--normal); }
  .card-bar.atencao{ background: var(--atencao); }
  .card-bar.risco{ background: var(--risco); }
  .card-bar.concluido{ background: var(--concluido); }

  .card-inner{ padding: 18px 20px 16px; }

  .card-top{ display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; margin-bottom: 14px; }
  .card-top .meta{ font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .card-top h3{ font-size: 16.5px; font-weight: 800; margin: 0; line-height: 1.3; }

  .badge{ font-size: 11px; padding: 4px 11px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
  .badge.normal{ background: var(--normal-bg); color: var(--normal); }
  .badge.atencao{ background: var(--atencao-bg); color: var(--atencao); }
  .badge.risco{ background: var(--risco-bg); color: var(--risco); }
  .badge.concluido{ background: var(--concluido-bg); color: var(--concluido); }

  .metrics-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .metric-head{ display:flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 5px; }
  .metric-head .val{ font-family: 'Overpass', sans-serif; font-weight: 800; }
  .metric-head .val.normal{ color: var(--normal); }
  .metric-head .val.atencao{ color: var(--atencao); }
  .metric-head .val.risco{ color: var(--risco); }
  .metric-head .val.concluido{ color: var(--concluido); }
  .bar{ height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar-fill{ height: 100%; border-radius: 4px; }
  .bar-fill.normal{ background: var(--normal); }
  .bar-fill.atencao{ background: var(--atencao); }
  .bar-fill.risco{ background: var(--risco); }
  .bar-fill.concluido{ background: var(--concluido); }

  .investimento{
    font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 15px;
    padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .investimento .label{ font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; display:block; margin-bottom: 2px; }

  .riscos-box{ border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .riscos-box.normal{ background: var(--normal-bg); }
  .riscos-box.atencao{ background: var(--atencao-bg); }
  .riscos-box.risco{ background: var(--risco-bg); }
  .riscos-box.concluido{ background: var(--concluido-bg); }
  .riscos-box .label{ font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
  .riscos-box.normal .label{ color: var(--normal); }
  .riscos-box.atencao .label{ color: var(--atencao); }
  .riscos-box.risco .label{ color: var(--risco); }
  .riscos-box.concluido .label{ color: var(--concluido); }
  .riscos-box .txt{ font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.45; white-space: pre-line; }
  .riscos-box .txt.empty{ font-weight: 500; font-style: italic; opacity: .6; }

  .detail-row{ font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.5; }
  .detail-row b{ color: var(--ink); font-weight: 700; }
  .detail-row .txt{ white-space: pre-line; }

  .card-actions{ display:flex; gap: 12px; padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--line); }
  .card-actions button{ background: none; border: none; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 0; }
  .card-actions button:hover{ color: var(--ink); }

  .empty-state{ grid-column: 1 / -1; text-align:center; padding: 60px 20px; color: var(--ink-soft); font-weight: 500; }

  /* Modal */
  .overlay{ position: fixed; inset: 0; background: rgba(22,33,58,0.45); display:none; align-items:center; justify-content:center; padding: 20px; z-index: 10; }
  .overlay.open{ display:flex; }
  .modal{ background: var(--card); max-width: 620px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 28px 30px; border-radius: 16px; }
  .modal h2{ font-size: 19px; font-weight: 800; margin: 0 0 18px; }
  .form-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-grid .full{ grid-column: 1/-1; }
  .form-grid label{ display:block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .form-grid input, .form-grid select, .form-grid textarea{
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-family: 'Overpass', sans-serif; font-size: 13px; color: var(--ink);
  }
  .form-grid textarea{ font-family: 'Overpass', sans-serif; resize: vertical; min-height: 56px; }
  .modal-actions{ display:flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions button{ padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .modal-actions button.secondary{ background: none; color: var(--ink); }

  @media (max-width: 900px){ .summary{ grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 640px){
    .summary{ grid-template-columns: 1fr 1fr; }
    .form-grid{ grid-template-columns: 1fr; }
    .grid{ grid-template-columns: 1fr; }
    .metrics-row{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">

      if(error) throw new Error(error.message);
      setStatus('', 'Guardado.');
      return true;

      setStatus('err', 'Erro ao guardar: ' + e.message);
      return false;
    }

  // --- Importação de Excel (formato "Ponto de Situação Projeto PRR") ---
  function normalizeKey(str){
    return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function normalizeEstado(str){
    const n = normalizeKey(str);
    if(n.includes('atraso')) return 'em_atraso';
    if(n.includes('conclu')) return 'concluido';
    if(n.includes('iniciar') || n.includes('inciar')) return 'por_iniciar';
    if(n.includes('execu')) return 'em_execucao';
    return 'em_execucao';
  }
  function slugify(str){
    return normalizeKey(str).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'projeto';
  }
  function toPercent(v){
    if(v === null || v === undefined || v === '') return null;
    const n = Number(v);
    if(isNaN(n)) return null;
    return Math.round(n <= 1 ? n * 100 : n);
  }
  function toNumber(v){
    if(v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return isNaN(n) ? null : n;
  }

  const EXCEL_FIELD_MATCHERS = [
    { field: 'unidade', test: k => k === 'unidade' },
    { field: 'ficha', test: k => k.includes('ficha') },
    { field: 'nome', test: k => k.includes('nome') },
    { field: 'estado', test: k => k === 'estado' },
    { field: 'taxaProjeto', test: k => k.includes('taxa') && k.includes('execu') && k.includes('projeto') },
    { field: 'investimentoTotal', test: k => k.includes('investimento') },
    { field: 'taxaFinanceira', test: k => k.includes('taxa') && k.includes('financeira') },
    { field: 'dependencias', test: k => k.includes('dependenc') },
    { field: 'riscos', test: k => k.includes('risco') },
    { field: 'proximosPassos', test: k => k.includes('proximos') && k.includes('passos') },
    { field: 'gestor', test: k => k.includes('gestor') },
  ];

  function parseProjectsSheet(rows){
    let headerRowIdx = -1, colMap = {};
    for(let r = 0; r < rows.length; r++){
      const row = rows[r] || [];
      const map = {};
      row.forEach((cell, c) => {
        const key = normalizeKey(cell);
        if(!key) return;
        const match = EXCEL_FIELD_MATCHERS.find(m => m.test(key));
        if(match) map[match.field] = c;
      });
      if(map.nome !== undefined && map.estado !== undefined){
        headerRowIdx = r; colMap = map; break;
      }
    }
    if(headerRowIdx === -1) throw new Error('Não encontrei a linha de cabeçalhos (ex: "Nome do Projetos", "Estado") na folha.');

    const usedIds = new Set();
    const projects = [];
    for(let r = headerRowIdx + 1; r < rows.length; r++){
      const row = rows[r] || [];
      const nome = colMap.nome !== undefined ? (row[colMap.nome] || '').toString().trim() : '';
      if(!nome) continue;
      const base = slugify(nome);
      let uniqueId = base, i = 2;
      while(usedIds.has(uniqueId)) uniqueId = `${base}-${i++}`;
      usedIds.add(uniqueId);

      projects.push({
        id: uniqueId,
        nome,
        unidade: colMap.unidade !== undefined ? (row[colMap.unidade] || '').toString().trim() : '',
        ficha: colMap.ficha !== undefined ? (row[colMap.ficha] || '').toString().trim() : '',
        estado: colMap.estado !== undefined ? normalizeEstado(row[colMap.estado]) : 'em_execucao',
        gestor: colMap.gestor !== undefined ? (row[colMap.gestor] || '').toString().trim() : '',
        taxaProjeto: colMap.taxaProjeto !== undefined ? toPercent(row[colMap.taxaProjeto]) : null,
        taxaFinanceira: colMap.taxaFinanceira !== undefined ? toPercent(row[colMap.taxaFinanceira]) : null,
        investimentoTotal: colMap.investimentoTotal !== undefined ? toNumber(row[colMap.investimentoTotal]) : null,
        dependencias: colMap.dependencias !== undefined ? (row[colMap.dependencias] || '').toString().trim() : '',
        riscos: colMap.riscos !== undefined ? (row[colMap.riscos] || '').toString().trim() : '',
        proximosPassos: colMap.proximosPassos !== undefined ? (row[colMap.proximosPassos] || '').toString().trim() : '',
        updatedAt: new Date().toISOString(),
      });
    }
    return projects;
  }

  $.importExcelInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';

    if(typeof XLSX === 'undefined'){
      setStatus('err', 'A biblioteca de importação não carregou. Verifica a ligação à internet e tenta de novo.');
      return;
    }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('PDS PRR') ? 'PDS PRR' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
      const imported = parseProjectsSheet(rows);
      if(!imported.length){ setStatus('err', 'Não encontrei projetos para importar neste ficheiro.'); return; }
      if(!confirm(`Importar ${imported.length} projeto(s) deste Excel? Isto substitui todos os projetos atuais.`)) return;
      state.projects = imported;
      render();
      await dbReplaceAll(imported);
      setStatus('', `${imported.length} projeto(s) importado(s) do Excel.`);
    } catch(err){
      setStatus('err', 'Erro ao importar Excel: ' + err.message);
    }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function fmtEuro(v){
    if(v === null || v === undefined || v === '') return '—';
    return '€' + Number(v).toLocaleString('pt-PT', { maximumFractionDigits: 0 });
  }

  function renderSummary(list){
    $.sumExecucao.textContent = list.filter(p => p.estado === 'em_execucao').length;
    $.sumConcluidos.textContent = list.filter(p => p.estado === 'concluido').length;
    $.sumAtraso.textContent = list.filter(p => p.estado === 'em_atraso').length;

    const withTaxaP = list.filter(p => typeof p.taxaProjeto === 'number');
    const avgTaxaP = withTaxaP.length ? withTaxaP.reduce((s,p) => s + p.taxaProjeto, 0) / withTaxaP.length : 0;
    $.sumTaxaProjeto.textContent = avgTaxaP.toFixed(0) + '%';

    const totalInvest = list.reduce((s,p) => s + (typeof p.investimentoTotal === 'number' ? p.investimentoTotal : 0), 0);
    $.sumInvestimento.textContent = fmtEuro(totalInvest);

    const withTaxaF = list.filter(p => typeof p.taxaFinanceira === 'number');
    const avgTaxaF = withTaxaF.length ? withTaxaF.reduce((s,p) => s + p.taxaFinanceira, 0) / withTaxaF.length : 0;
    $.sumTaxaFin.textContent = avgTaxaF.toFixed(0) + '%';
  }

  function cardHtml(p){
    const color = ESTADO_COLOR[p.estado] || 'normal';
    const taxaP = typeof p.taxaProjeto === 'number' ? p.taxaProjeto : null;
    const taxaF = typeof p.taxaFinanceira === 'number' ? p.taxaFinanceira : null;

    return `
      <div class="card">
        <div class="card-bar ${color}"></div>
        <div class="card-inner">
          <div class="card-top">
            <div>
              <div class="meta">${escapeHtml(p.unidade || '—')}${p.ficha ? ' · Ficha ' + escapeHtml(p.ficha) : ''}</div>
              <h3>${escapeHtml(p.nome)}</h3>
            </div>
            <span class="badge ${color}">${ESTADO_LABEL[p.estado] || p.estado}</span>
          </div>

          <div class="metrics-row">
            <div>
              <div class="metric-head"><span>Execução do projeto</span><span class="val ${color}">${taxaP !== null ? taxaP + '%' : '—'}</span></div>
              <div class="bar"><div class="bar-fill ${color}" style="width:${taxaP || 0}%"></div></div>
            </div>
            <div>
              <div class="metric-head"><span>Execução financeira</span><span class="val ${color}">${taxaF !== null ? taxaF + '%' : '—'}</span></div>
              <div class="bar"><div class="bar-fill ${color}" style="width:${taxaF || 0}%"></div></div>
            </div>
          </div>

          <div class="investimento"><span class="label">Investimento total</span>${fmtEuro(p.investimentoTotal)}</div>

          <div class="riscos-box ${color}">
            <div class="label">Riscos</div>
            <div class="txt ${p.riscos ? '' : 'empty'}">${p.riscos ? escapeHtml(p.riscos) : 'Sem riscos registados.'}</div>
          </div>

          ${p.dependencias ? `<div class="detail-row"><b>Dependências:</b> <span class="txt">${escapeHtml(p.dependencias)}</span></div>` : ''}
          ${p.proximosPassos ? `<div class="detail-row"><b>Próximos passos:</b> <span class="txt">${escapeHtml(p.proximosPassos)}</span></div>` : ''}
          ${p.gestor ? `<div class="detail-row"><b>Gestor de projeto:</b> ${escapeHtml(p.gestor)}</div>` : ''}

          <div class="card-actions">
            <button class="edit" data-id="${p.id}">editar</button>
          </div>
        </div>
      </div>
    `;
  }

  function render(){
    const list = state.projects.filter(p => state.filter === 'todos' || p.estado === state.filter);
    renderSummary(state.projects);

    if(state.projects.length){
      const latest = state.projects.reduce((max, p) => (p.updatedAt || '') > max ? p.updatedAt : max, '');
      $.updatedLabel.textContent = latest ? 'Última atualização: ' + new Date(latest).toLocaleDateString('pt-PT') : '';
    }

    if(list.length === 0){
      $.groupsContainer.innerHTML = `<div class="empty-state">Sem projetos nesta vista.</div>`;
      return;
    }

    const groups = {};
    list.forEach(p => {
      const key = p.unidade || 'Sem unidade';
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    });

    $.groupsContainer.innerHTML = Object.keys(groups).sort().map(key => `
      <div class="category-group">
        <div class="category-title">${escapeHtml(key)}</div>
        <div class="grid">
          ${groups[key].sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||'')).map(cardHtml).join('')}
        </div>
      </div>
    `).join('');

    $.groupsContainer.querySelectorAll('.edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = state.projects.find(x => x.id === btn.dataset.id);
        if(p) openModal(p);
      });
    });

  const PPT_COLOR = {
    ink: '16213A', inkSoft: '6B7690', line: 'E4E8F0', card: 'FFFFFF', bg: 'F4F6FA',
    normal: '1E8A5F', normalBg: 'E4F3EC',
    atencao: 'D98A1E', atencaoBg: 'FCF0DD',
    risco: 'C6432E', riscoBg: 'FBE6E2',
    concluido: '2C5F8A', concluidoBg: 'E1EAF1',
  };

  function avgPct(list, field){
    const vals = list.filter(p => typeof p[field] === 'number');
    if(!vals.length) return 0;
    return Math.round(vals.reduce((s,p) => s + p[field], 0) / vals.length);
  }
  function sumField(list, field){
    return list.reduce((s,p) => s + (typeof p[field] === 'number' ? p[field] : 0), 0);
  }
  function groupByUnidade(list){
    const g = {};
    list.forEach(p => { const k = p.unidade || 'Sem unidade'; if(!g[k]) g[k] = []; g[k].push(p); });
    return g;
  }
  function chunkArray(arr, size){
    const out = [];
    for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  function truncateText(str, maxChars){
    if(!str || str.length <= maxChars) return str;
    const cut = str.slice(0, maxChars);
    const lastSpace = cut.lastIndexOf(' ');
    return (lastSpace > maxChars * 0.6 ? cut.slice(0, lastSpace) : cut).trim() + '…';
  }

  function addProjectCardShape(pres, slide, p, x, y, w, h){
    const color = ESTADO_COLOR[p.estado] || 'normal';
    const hex = PPT_COLOR[color];
    const hexBg = PPT_COLOR[color + 'Bg'];

    slide.addShape(pres.ShapeType.roundRect, { x, y, w, h, rectRadius: 0.06, fill: { color: PPT_COLOR.card }, line: { color: PPT_COLOR.line, width: 0.75 } });
    slide.addShape(pres.ShapeType.rect, { x, y, w: 0.07, h, fill: { color: hex }, line: { type: 'none' } });

    const padL = x + 0.22;
    const leftW = w * 0.55;
    const contentW = leftW - 0.35;

    const badgeW = 1.1, badgeH = 0.22;

    slide.addShape(pres.ShapeType.ellipse, { x: padL, y: y + 0.16, w: 0.13, h: 0.13, fill: { color: hex }, line: { type: 'none' } });
    slide.addText((p.unidade || '—') + (p.ficha ? ' · Ficha ' + p.ficha : ''), { x: padL + 0.2, y: y + 0.08, w: contentW - badgeW - 0.15, h: 0.2, fontSize: 7, bold: true, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
    slide.addText(p.nome || '', { x: padL + 0.2, y: y + 0.32, w: contentW, h: 0.45, fontSize: 10.5, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass', valign: 'top', shrinkText: true });

    const badgeX = padL + 0.2 + contentW - badgeW;
    slide.addShape(pres.ShapeType.roundRect, { x: badgeX, y: y + 0.07, w: badgeW, h: badgeH, rectRadius: 0.05, fill: { color: hexBg }, line: { type: 'none' } });
    slide.addText(ESTADO_LABEL[p.estado] || p.estado || '', { x: badgeX, y: y + 0.07, w: badgeW, h: badgeH, align: 'center', fontSize: 6.5, bold: true, color: hex, fontFace: 'Overpass', valign: 'middle' });

    function drawBar(label, value, barTop){
      slide.addText(label, { x: padL, y: barTop, w: contentW, h: 0.16, fontSize: 6.5, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
      slide.addText(value !== null ? value + '%' : '—', { x: padL, y: barTop, w: contentW, h: 0.16, align: 'right', fontSize: 8.5, bold: true, color: hex, fontFace: 'Overpass' });
      slide.addShape(pres.ShapeType.rect, { x: padL, y: barTop + 0.17, w: contentW, h: 0.055, fill: { color: 'E4E8F0' }, line: { type: 'none' } });
      if(value){
        slide.addShape(pres.ShapeType.rect, { x: padL, y: barTop + 0.17, w: contentW * Math.min(1, value / 100), h: 0.055, fill: { color: hex }, line: { type: 'none' } });
      }
    }

    const taxaP = typeof p.taxaProjeto === 'number' ? p.taxaProjeto : null;
    const taxaF = typeof p.taxaFinanceira === 'number' ? p.taxaFinanceira : null;
    const bar1Y = y + 0.78;
    const bar2Y = bar1Y + 0.30;
    drawBar('Execução do projeto', taxaP, bar1Y);
    drawBar('Execução financeira', taxaF, bar2Y);

    slide.addText('Investimento: ' + fmtEuro(p.investimentoTotal), { x: padL, y: bar2Y + 0.30, w: contentW, h: 0.2, fontSize: 10, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass' });

    const boxX = x + w * 0.58;
    const boxW = w * 0.4;
    const boxY = y + 0.14;
    const boxH = h - 0.28;
    const boxGap = 0.1;
    const sectionH = (boxH - boxGap * 2) / 3;

    const INFO_TEXT_MAX_CHARS = 210;

    function drawInfoBox(label, text, boxTop, opts){
      slide.addShape(pres.ShapeType.roundRect, { x: boxX, y: boxTop, w: boxW, h: sectionH, rectRadius: 0.04, fill: { color: opts.bg }, line: opts.line || { type: 'none' } });
      slide.addText(label, { x: boxX + 0.12, y: boxTop + 0.06, w: boxW - 0.24, h: 0.18, fontSize: 6.5, bold: true, color: opts.labelColor, fontFace: 'Overpass' });
      slide.addText(truncateText(text, INFO_TEXT_MAX_CHARS), { x: boxX + 0.12, y: boxTop + 0.25, w: boxW - 0.24, h: sectionH - 0.33, fontSize: 8.5, color: PPT_COLOR.ink, fontFace: 'Overpass', valign: 'top', shrinkText: true });
    }

    drawInfoBox('DEPENDÊNCIAS', p.dependencias || 'Sem dependências registadas.', boxY, { bg: PPT_COLOR.card, line: { color: PPT_COLOR.line, width: 0.75 }, labelColor: PPT_COLOR.inkSoft });
    drawInfoBox('RISCOS', p.riscos || 'Sem riscos registados.', boxY + (sectionH + boxGap), { bg: hexBg, labelColor: hex });
    drawInfoBox('PRÓXIMOS PASSOS', p.proximosPassos || 'Sem próximos passos registados.', boxY + 2 * (sectionH + boxGap), { bg: PPT_COLOR.card, line: { color: PPT_COLOR.line, width: 0.75 }, labelColor: PPT_COLOR.inkSoft });
  }

  function fmtList(arr){
    if(!arr.length) return '';
    if(arr.length === 1) return arr[0];
    return arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1];
  }

  function buildExecutiveSummaryParagraphs(all){
    const nExecucao = all.filter(p => p.estado === 'em_execucao').length;
    const nConcluido = all.filter(p => p.estado === 'concluido').length;
    const nAtraso = all.filter(p => p.estado === 'em_atraso').length;
    const execGlobal = avgPct(all, 'taxaProjeto');

    const atrasoClause = nAtraso === 0
      ? 'não se encontrando projetos formalmente classificados como em atraso'
      : `identificando-se ${nAtraso} projeto${nAtraso > 1 ? 's' : ''} formalmente classificado${nAtraso > 1 ? 's' : ''} como em atraso`;
    const p1 = `Os dados denotam um nível global de execução de ${execGlobal}%, com ${nExecucao} projeto${nExecucao !== 1 ? 's' : ''} em execução e ${nConcluido} concluído${nConcluido !== 1 ? 's' : ''}, ${atrasoClause}.`;

    const taxas = all.map(p => p.taxaProjeto).filter(v => typeof v === 'number');
    const range = taxas.length > 1 ? Math.max(...taxas) - Math.min(...taxas) : 0;

    const gaps = all
      .filter(p => typeof p.taxaProjeto === 'number' && typeof p.taxaFinanceira === 'number')
      .map(p => ({ p, gap: p.taxaProjeto - p.taxaFinanceira }));
    const avgGap = gaps.length ? gaps.reduce((s, g) => s + g.gap, 0) / gaps.length : 0;

    const heteroClause = range >= 25 ? 'alguma heterogeneidade no nível de execução dos projetos' : '';
    const gapClause = avgGap >= 10
      ? 'destacando-se projetos com execução física significativamente superior à financeira'
      : (avgGap <= -10 ? 'destacando-se projetos com execução financeira superior à física' : '');
    const bits2 = [heteroClause, gapClause].filter(Boolean);
    const p2 = bits2.length
      ? `Contudo, verifica-se ${bits2.join(', ')}.`
      : 'Verifica-se uma execução relativamente homogénea entre os projetos, sem desfasamentos relevantes entre a execução física e financeira.';

    const LOW_THRESHOLD = 50;
    const lowProjects = all
      .filter(p => (p.estado === 'em_execucao' || p.estado === 'em_atraso') &&
        (p.estado === 'em_atraso' || (typeof p.taxaProjeto === 'number' && p.taxaProjeto < LOW_THRESHOLD)))
      .sort((a, b) => {
        const rank = x => x.estado === 'em_atraso' ? 0 : 1;
        return rank(a) - rank(b) || (a.taxaProjeto ?? 0) - (b.taxaProjeto ?? 0);
      })
      .slice(0, 3);

    const GAP_THRESHOLD = 15;
    const gapProjects = gaps
      .filter(g => g.p.estado !== 'concluido' && g.gap >= GAP_THRESHOLD)
      .sort((a, b) => b.gap - a.gap)
      .slice(0, 3)
      .map(g => g.p);

    const attentionParts = [];
    if(lowProjects.length){
      const lowLabel = p => p.estado === 'em_atraso'
        ? `${p.nome} (em atraso${typeof p.taxaProjeto === 'number' ? ', ' + p.taxaProjeto + '%' : ''})`
        : `${p.nome} (${p.taxaProjeto}%)`;
      attentionParts.push(`aos projetos com menor execução ou em atraso, nomeadamente ${fmtList(lowProjects.map(lowLabel))}`);
    }
    if(gapProjects.length){
      attentionParts.push(`aos projetos com maior desfasamento entre execução física e financeira, nomeadamente ${fmtList(gapProjects.map(p => `${p.nome} (${p.taxaProjeto}% vs ${p.taxaFinanceira}%)`))}`);
    }
    const p3 = attentionParts.length
      ? `Nota: particular atenção deverá ser dada ${attentionParts.join(', bem como ')}.`
      : 'Nota: não se identificam, nesta atualização, projetos que requeiram atenção particular ao nível da execução.';

    return [p1, p2, p3];
  }

  function addExecutiveSummarySlide(pres, all, PAGE_W, PAGE_H, MARGIN){
    const slide = pres.addSlide();
    slide.background = { color: PPT_COLOR.bg };
    slide.addText('Sumário Executivo', { x: MARGIN, y: 0.35, w: 8, h: 0.55, fontSize: 24, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass' });
    slide.addText('Avaliação global — ' + new Date().toLocaleDateString('pt-PT'), { x: MARGIN, y: 0.92, w: 8, h: 0.35, fontSize: 12, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
    slide.addImage({ data: SPMS_LOGO_DATA_URI, x: PAGE_W - MARGIN - 2.45, y: 0.35, w: 2.45, h: 0.45 });

    const boxY = 1.5, boxH = PAGE_H - boxY - 0.5;
    slide.addShape(pres.ShapeType.roundRect, { x: MARGIN, y: boxY, w: PAGE_W - MARGIN * 2, h: boxH, rectRadius: 0.06, fill: { color: PPT_COLOR.card }, line: { color: PPT_COLOR.line, width: 0.75 } });
    slide.addText(buildExecutiveSummaryParagraphs(all).join('\n\n'), {
      x: MARGIN + 0.35, y: boxY + 0.25, w: PAGE_W - MARGIN * 2 - 0.7, h: boxH - 0.5,
      fontSize: 14, color: PPT_COLOR.ink, fontFace: 'Overpass', valign: 'top', lineSpacingMultiple: 1.3, shrinkText: true,
    });
  }

  function addCoordenacaoSlide(pres, unidade, projects, page, totalPages, PAGE_W, PAGE_H, MARGIN){
    const slide = pres.addSlide();
    slide.background = { color: PPT_COLOR.bg };
    slide.addText('Projetos', { x: MARGIN, y: 0.35, w: 8, h: 0.55, fontSize: 24, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass' });
    slide.addText('COORDENAÇÃO ' + unidade.toUpperCase(), { x: MARGIN, y: 0.9, w: 8, h: 0.3, fontSize: 11, bold: true, color: PPT_COLOR.concluido, fontFace: 'Overpass' });
    slide.addImage({ data: SPMS_LOGO_DATA_URI, x: PAGE_W - MARGIN - 1.75, y: 0.32, w: 1.75, h: 0.32 });
    if(totalPages > 1){
      slide.addText(`${page} / ${totalPages}`, { x: PAGE_W - MARGIN - 1.2, y: 0.7, w: 1.2, h: 0.3, align: 'right', fontSize: 10, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
    }

    const cols = 1, rows = 2, gap = 0.22, gridTop = 1.45;
    const gridW = PAGE_W - MARGIN * 2;
    const gridH = PAGE_H - gridTop - 0.35;
    const cardW = (gridW - gap * (cols - 1)) / cols;
    const cardH = (gridH - gap * (rows - 1)) / rows;

    projects.forEach((p, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = MARGIN + col * (cardW + gap);
      const y = gridTop + row * (cardH + gap);
      addProjectCardShape(pres, slide, p, x, y, cardW, cardH);
    });
  }

  async function exportPptx(){
    if(typeof PptxGenJS === 'undefined'){
      setStatus('err', 'A biblioteca de exportação não carregou. Verifica a ligação à internet e tenta de novo.');
      return;
    }
    $.exportPptxBtn.disabled = true;
    $.exportPptxBtn.textContent = 'A gerar...';

    try{
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_WIDE';
      const PAGE_W = 13.33, PAGE_H = 7.5, MARGIN = 0.5;
      const all = state.projects;

      const dir = pres.addSlide();
      dir.background = { color: PPT_COLOR.bg };
      dir.addText('Status Projetos PRR', { x: MARGIN, y: 0.35, w: 8, h: 0.55, fontSize: 26, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass' });
      dir.addText('Visão global — Direção · ' + new Date().toLocaleDateString('pt-PT'), { x: MARGIN, y: 0.92, w: 8, h: 0.35, fontSize: 12, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
      dir.addImage({ data: SPMS_LOGO_DATA_URI, x: PAGE_W - MARGIN - 2.45, y: 0.35, w: 2.45, h: 0.45 });

      const stats = [
        { label: 'Em execução', value: String(all.filter(p => p.estado === 'em_execucao').length) },
        { label: 'Concluídos', value: String(all.filter(p => p.estado === 'concluido').length) },
        { label: 'Em atraso', value: String(all.filter(p => p.estado === 'em_atraso').length) },
        { label: 'Taxa execução projeto', value: avgPct(all, 'taxaProjeto') + '%' },
        { label: 'Investimento total', value: fmtEuro(sumField(all, 'investimentoTotal')) },
        { label: 'Taxa execução financeira', value: avgPct(all, 'taxaFinanceira') + '%' },
      ];
      const tileGap = 0.15;
      const tileW = (PAGE_W - MARGIN * 2 - tileGap * (stats.length - 1)) / stats.length;
      stats.forEach((s, i) => {
        const x = MARGIN + i * (tileW + tileGap);
        dir.addShape(pres.ShapeType.roundRect, { x, y: 1.5, w: tileW, h: 1.05, rectRadius: 0.05, fill: { color: PPT_COLOR.card }, line: { color: PPT_COLOR.line, width: 0.75 } });
        dir.addText(s.value, { x, y: 1.6, w: tileW, h: 0.5, align: 'center', fontSize: 16, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass', shrinkText: true });
        dir.addText(s.label, { x: x + 0.05, y: 2.12, w: tileW - 0.1, h: 0.38, align: 'center', fontSize: 10, bold: true, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
      });

      const unidades = groupByUnidade(all);
      let rowY = 2.9;
      dir.addText('RESUMO POR COORDENAÇÃO', { x: MARGIN, y: rowY, w: 6, h: 0.3, fontSize: 10, bold: true, color: PPT_COLOR.inkSoft, fontFace: 'Overpass' });
      rowY += 0.4;
      Object.keys(unidades).sort().forEach(key => {
        const list = unidades[key];
        const nAtraso = list.filter(p => p.estado === 'em_atraso').length;
        const rowColor = nAtraso > 0 ? PPT_COLOR.risco : PPT_COLOR.normal;
        const rowW = PAGE_W - MARGIN * 2;
        dir.addShape(pres.ShapeType.roundRect, { x: MARGIN, y: rowY, w: rowW, h: 0.5, rectRadius: 0.04, fill: { color: PPT_COLOR.card }, line: { color: PPT_COLOR.line, width: 0.75 } });
        dir.addShape(pres.ShapeType.rect, { x: MARGIN, y: rowY, w: 0.07, h: 0.5, fill: { color: rowColor }, line: { type: 'none' } });
        dir.addText(key, { x: MARGIN + 0.25, y: rowY, w: 2.6, h: 0.5, fontSize: 11, bold: true, color: PPT_COLOR.ink, fontFace: 'Overpass', valign: 'middle' });
        dir.addText(`${list.length} projeto(s)`, { x: MARGIN + 2.9, y: rowY, w: 2, h: 0.5, fontSize: 9, color: PPT_COLOR.inkSoft, fontFace: 'Overpass', valign: 'middle' });
        dir.addText(`Execução média: ${avgPct(list, 'taxaProjeto')}%`, { x: MARGIN + 5, y: rowY, w: 3, h: 0.5, fontSize: 9, color: PPT_COLOR.ink, fontFace: 'Overpass', valign: 'middle' });
        dir.addText(`Em atraso: ${nAtraso}`, { x: MARGIN + rowW - 2.2, y: rowY, w: 2.2, h: 0.5, fontSize: 9, bold: nAtraso > 0, color: nAtraso > 0 ? PPT_COLOR.risco : PPT_COLOR.inkSoft, fontFace: 'Overpass', valign: 'middle', align: 'right' });
        rowY += 0.62;
      });

      addExecutiveSummarySlide(pres, all, PAGE_W, PAGE_H, MARGIN);

      Object.keys(unidades).sort().forEach(key => {
        const chunks = chunkArray(unidades[key], 2);
        chunks.forEach((chunk, i) => addCoordenacaoSlide(pres, key, chunk, i + 1, chunks.length, PAGE_W, PAGE_H, MARGIN));
      });

      await pres.writeFile({ fileName: 'Painel-PRR.pptx' });
      setStatus('', 'PowerPoint gerado.');
    } catch(e){
      setStatus('err', 'Erro ao gerar PowerPoint: ' + e.message);
    } finally {
      $.exportPptxBtn.disabled = false;
      $.exportPptxBtn.textContent = 'Exportar PowerPoint';
    }
  }

  $.exportPptxBtn.addEventListener('click', exportPptx);

  render();
  dbLoad();
})();
</script>
